
<script type="text/javascript">
    // BBCode parser for buddy request previews
    window.buddyBBCodeParser = function(text) {
        if (!text) return '';
        var html = text
            .replace(/\[b\](.*?)\[\/b\]/gi, '<strong style="font-weight:bold">$1</strong>')
            .replace(/\[i\](.*?)\[\/i\]/gi, '<em style="font-style:italic">$1</em>')
            .replace(/\[u\](.*?)\[\/u\]/gi, '<span style="text-decoration:underline">$1</span>')
            .replace(/\[s\](.*?)\[\/s\]/gi, '<span style="text-decoration:line-through">$1</span>')
            .replace(/\[sup\](.*?)\[\/sup\]/gi, '<sup>$1</sup>')
            .replace(/\[sub\](.*?)\[\/sub\]/gi, '<sub>$1</sub>')
            .replace(/\[color=(.*?)\](.*?)\[\/color\]/gi, '<span style="color:$1">$2</span>')
            .replace(/\[size=(\d+)\](.*?)\[\/size\]/gi, '<span style="font-size:$1px">$2</span>')
            .replace(/\[url=(.*?)\](.*?)\[\/url\]/gi, '<a href="$1" target="_blank" style="color:#6f9fc8;text-decoration:underline">$2</a>')
            .replace(/\[url\](.*?)\[\/url\]/gi, '<a href="$1" target="_blank" style="color:#6f9fc8;text-decoration:underline">$1</a>')
            .replace(/\n/g, '<br>');
        return '<div style="color:#fff;padding:5px">' + html + '</div>';
    };
</script>

    <script type="text/javascript">
        isMobile = false;
        isMobileApp = false;
        LocalizationStrings = {"attention":"Caution","yes":"yes","no":"No","ok":"Ok","redirectMessage":"By following this link, you will leave OGame. Do you wish to continue?"};
        var allyHome = '';

        initAllianceInfo();
        initBBCodes();

        // Parse BBCode in alliance text on page load
        $(document).ready(function() {
            var allianceTextElement = document.getElementById('allianceTextContent');
            if (allianceTextElement && typeof window.buddyBBCodeParser === 'function') {
                var rawText = allianceTextElement.textContent.trim();
                if (rawText) {
                    allianceTextElement.innerHTML = window.buddyBBCodeParser(rawText);
                }
            }

            // Handle apply to alliance button
            $('#applyToAllianceBtn').on('click', function() {
                errorBoxDecision(
                    LocalizationStrings.attention,
                    "Do you want to apply to this alliance?",
                    LocalizationStrings.yes,
                    LocalizationStrings.no,
                    function() {
                        $.ajax({
                            url: 'http://localhost/alliance/apply',
                            type: 'POST',
                            data: {
                                alliance_id: 12,
                                message: '',
                                _token: 'Xq2mZ8vR4kL0pT6yB1nW9cE3sH7jD5fA2gU8iO4e'
                            },
                            success: function(response) {
                                if (response.success) {
                                    fadeBox(response.message || "Application submitted successfully", false);
                                    setTimeout(function() {
                                        window.close();
                                    }, 2000);
                                } else {
                                    fadeBox(response.message || "Failed to submit application", true);
                                }
                            },
                            error: function(xhr) {
                                var errorMessage = "Failed to submit application";
                                if (xhr.responseJSON && xhr.responseJSON.message) {
                                    errorMessage = xhr.responseJSON.message;
                                }
                                fadeBox(errorMessage, true);
                            }
                        });
                    }
                );
            });
        });
    </script>
