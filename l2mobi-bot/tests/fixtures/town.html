<script type="text/javascript">
var TOWN = {
    px: 50,
    py: 92,
    vw: 340,
    vh: 380,
    ww: 1097,
    wh: 617,
    gTop: 70,
    gBot: 96,
    nearR: 8,
    speed: 30,
    token: 'a785e53b860f12a50d31df71d70434b1'
};
</script>
<script type="text/javascript">
(function(){
    var world  = document.getElementById('town-world');
    var wrap   = document.getElementById('town-map-wrap');
    var player = document.getElementById('town-player');
    var pimg   = document.getElementById('town-player-img');
    var dest   = document.getElementById('town-dest');
    if (!world || !wrap || !player || !pimg) { return; }

    var T = TOWN;
    var cur = { x: T.px, y: T.py };
    var tgt = null, stopR = 0, cb = null;
    var timer = null, lastT = 0;
    var lastSave = 0;

    function clX(v){ return Math.min(98, Math.max(2, v)); }
    function clY(v){ return Math.min(T.gBot, Math.max(T.gTop, v)); }
    function applyCam(){
        var cx = (cur.x / 100 * T.ww) - (T.vw / 2);
        var cy = (cur.y / 100 * T.wh) - (T.vh / 2);
        if (cx < 0) cx = 0;
        if (cx > T.ww - T.vw) cx = T.ww - T.vw;
        if (cy < 0) cy = 0;
        if (cy > T.wh - T.vh) cy = T.wh - T.vh;
        world.style.left = '-' + Math.round(cx) + 'px';
        world.style.top  = '-' + Math.round(cy) + 'px';
    }
    function applyPos(){
        player.style.left   = cur.x + '%';
        player.style.top    = cur.y + '%';
        player.style.zIndex = 51 + Math.round(cur.y);
        var d  = 0.55 + 0.45 * (cur.y / 100);
        pimg.style.height = Math.round(34 + 20 * d) + 'px';
        pimg.style.width  = 'auto';
        applyCam();
    }
    function setFace(dir){
        var c = 'town-player';
        if (dir === 'l') c += ' is-walking looking-left';
        else if (dir === 'r') c += ' is-walking';
        player.className = c;
    }
    function savePos(){
        var im = new Image();
        im.src = 'town.php?possave=1&tk=' + T.token
               + '&px=' + Math.round(clX(cur.x))
               + '&py=' + Math.round(clY(cur.y))
               + '&r=' + (new Date()).getTime();
    }
    function step(){
        var now = (new Date()).getTime();
        if (!lastT) { lastT = now; }
        var dt = (now - lastT) / 1000;
        lastT = now;
        if (!tgt) { return; }
        var dx = tgt.x - cur.x, dy = tgt.y - cur.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        var stepLen = T.speed * dt;
        /* heartbeat во время бега — раз в 4 секунды */
        if (now - lastSave > 4000) { lastSave = now; savePos(); }
        if (dist <= Math.max(stopR, stepLen)) {
            if (stopR <= 0.5) { cur.x = clX(tgt.x); cur.y = clY(tgt.y); }
            tgt = null;
            if (dest) { dest.style.display = 'none'; }
            setFace('');
            applyPos();
            lastSave = now;
            savePos();
            var f = cb; cb = null;
            if (f) { f(); }
            return;
        }
        var k = stepLen / dist;
        cur.x += dx * k;
        cur.y += dy * k;
        setFace(dx < 0 ? 'l' : 'r');
        applyPos();
    }
    function walkTo(x, y, stop, onDone){
        x = clX(x); y = clY(y); stop = stop || 0;
        tgt = { x: x, y: y }; stopR = stop; cb = onDone || null;
        if (dest) {
            dest.style.left = x + '%';
            dest.style.top  = y + '%';
            dest.style.display = 'block';
        }
        setFace(x < cur.x ? 'l' : 'r');
        if (!timer) {
            lastT = 0;
            timer = setInterval(step, 30);
        }
    }

    /* Тап по земле */
    wrap.addEventListener('click', function(e){
        var r = world.getBoundingClientRect();
        if (!r.width) { return; }
        var xp = (e.clientX - r.left) / r.width * 100;
        var yp = (e.clientY - r.top) / r.height * 100;
        if (xp < 0 || xp > 100 || yp < 0 || yp > 100) { return; }
        cb = null;
        walkTo(xp, yp, 1, null);
    }, false);

    /* Тап по NPC: добежать и открыть */
    var pins = world.getElementsByTagName('a');
    for (var i = 0; i < pins.length; i++) {
        (function(a){
            var cn = a.className || '';
            if (cn.indexOf('town-npc-pin') < 0) { return; }
            var nx = parseFloat(a.getAttribute('data-nx'));
            var ny = parseFloat(a.getAttribute('data-ny'));
            if (isNaN(nx) || isNaN(ny)) { return; }
            a.addEventListener('click', function(ev){
                ev.preventDefault();
                ev.stopPropagation();
                var d = Math.sqrt((nx - cur.x)*(nx - cur.x) + (ny - cur.y)*(ny - cur.y));
                if (d <= T.nearR) { window.location.href = a.href; return; }
                walkTo(nx, ny, T.nearR, function(){
                    window.location.href = a.href;
                });
            }, false);
        })(pins[i]);
    }

    /* ============ ДРУГИЕ ИГРОКИ: обновление каждые 5 секунд ============ */
    function othersTick(){
        var x = new XMLHttpRequest();
        x.open('GET', 'town.php?others=1&tk=' + T.token + '&r=' + (new Date()).getTime(), true);
        x.onreadystatechange = function(){
            if (x.readyState != 4) { return; }
            if (!x.responseText) { return; }
            var arr = null;
            try { eval('arr = ' + x.responseText); } catch(e) { return; }
            if (!arr || !arr.length) { arr = []; }
            var cont = document.getElementById('town-others');
            if (!cont) { return; }
            var old = cont.getElementsByTagName('div');
            for (var i = old.length - 1; i >= 0; i--) {
                if ((old[i].className || '').indexOf('town-other') === 0) {
                    cont.removeChild(old[i]);
                }
            }
            for (var j = 0; j < arr.length; j++) {
                var o = arr[j];
                if (o.px < 2) o.px = 2; if (o.px > 98) o.px = 98;
                if (o.py < T.gTop) o.py = T.gTop; if (o.py > T.gBot) o.py = T.gBot;
                var d = 0.55 + 0.45 * (o.py / 100);
                var hh = Math.round(34 + 20 * d);
                var div = document.createElement('div');
                div.className = 'town-other';
                div.style.left = o.px + '%';
                div.style.top  = o.py + '%';
                div.style.zIndex = 50 + Math.round(o.py);
                div.innerHTML = '<img src="' + o.img + '" style="height:' + hh + 'px;width:auto;" alt="">'
                    + '<div class="othername">' + o.nick + '</div>';
                cont.appendChild(div);
            }
        };
        x.send(null);
    }
    setInterval(othersTick, 5000);

    /* Сохраняем позицию: при простое раз в 30 секунд и при уходе */
    setInterval(function(){
        if (!tgt) { savePos(); }
    }, 30000);
    window.addEventListener('beforeunload', function(){ savePos(); }, false);
})();
</script>
