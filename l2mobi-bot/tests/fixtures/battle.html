    for (var i = 0; i < els.length; i++) {
        var e = document.getElementById('l2bar-extra-' + els[i]);

        var el = document.getElementById('l2bar-extra-' + next);
        if (el) el.className = 'l2bar-extra-row open';
        opened++;

            var el2 = document.getElementById('l2bar-extra-' + els[j]);
            if (el2) el2.className = 'l2bar-extra-row';
        }
        opened = 0;
    }

    document.cookie = 'l2bar_open=' + opened + '; path=/; max-age=31536000';

    if (b) b.innerHTML = (opened >= 3) ? '\u25BC' : '\u25B2';

    if (!a) {
        a = document.createElement('audio');
        a.id = 'l2sfx-el';
        a.preload = 'auto';
        document.body.appendChild(a);
    }
    a.src = src;
    try {
        a.currentTime = 0;
        var p = a.play();
        if (p && p.catch) p.catch(function () {});
    } catch (e) {}
}

    while (el && el !== document) {
        if (el.tagName === 'A' && el.getAttribute('data-sfx')) {
            try { sessionStorage.setItem('l2sfx_play', el.getAttribute('data-sfx')); } catch (err) {}

function l2barCdFmt(sec) {
    if (sec >= 3600) {
        var h = Math.floor(sec / 3600),
            m = Math.floor((sec % 3600) / 60),
            s = Math.floor(sec % 60);
        return h + ':' + ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);

    if (sec >= 60) {
        var m2 = Math.floor(sec / 60), s2 = Math.floor(sec % 60);
        return m2 + ':' + ('0' + s2).slice(-2);

    if (sec >= 10) return '' + Math.floor(sec);
    if (sec >= 3)  return sec.toFixed(1);
    return sec.toFixed(2);
}

}

function l2barCdTick() {
    var now = (new Date().getTime() - l2barCdOffset) / 1000;
    for (var i = 0; i < l2barCdNodes.length; i++) {
        var el = l2barCdNodes[i];
        var left = parseFloat(el.getAttribute('data-cd-end')) - now;
        var txt = el.firstChild;
        if (left <= 0) {
            el.style.display = 'none';
            continue;
        }
        el.style.display = 'flex';
        if (txt) txt.innerHTML = l2barCdFmt(left);
    }
}

l2barCdCollect();
l2barCdTick();
setInterval(l2barCdTick, 100);
